[project]
name = "langchain-skill-runtime"
version = "0.3.4"
description = "Compile SKILL.md files or structured Skill objects into heterogeneous LangChain tools"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["langchain", "skill", "skill-md", "mcp", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.23,<5.0",
    "langchain-core>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
agent = [
    "langchain>=1.0,<2.0",
]
mcp = [
    "langchain-mcp-adapters>=0.3,<1.0",
]

[project.urls]
Homepage = "https://github.com/zhouqingsheng-github/langchain-skill-runtime"
Repository = "https://github.com/zhouqingsheng-github/langchain-skill-runtime"
Issues = "https://github.com/zhouqingsheng-github/langchain-skill-runtime/issues"
Documentation = "https://github.com/zhouqingsheng-github/langchain-skill-runtime#readme"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["README_EN.md", "doc/**", "examples/**"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260724",
]
