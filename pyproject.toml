[project]
name = "langchain-skill-runtime"
version = "0.1.0"
description = "Compile database-backed SKILL.md definitions and heterogeneous tools for LangChain agents"
readme = "doc/项目说明.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jsonschema>=4.23,<5.0",
    "langchain-core>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
agent = [
    "langchain>=1.0,<2.0",
]
mcp = [
    "langchain-mcp-adapters>=0.3,<1.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260724",
]
